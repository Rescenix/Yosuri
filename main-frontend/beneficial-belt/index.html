<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aurora</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c96442' d='M12 2L14.5 8.5L21 11L14.5 13.5L12 20L9.5 13.5L3 11L9.5 8.5L12 2Z' stroke='%23c96442' stroke-width='0.5' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <style>
      html, body {
        height: 100%;
        margin: 0;
        /* 用变量并给亮色兜底：这段内联样式在 JS 之前生效，写死白色的话
           暗色模式下根元素会一直是白的（页面边缘/滚动回弹处会漏白）。
           useTheme.js 启动后把 --app-bg/--app-text 注到 <html> 上，这里自然跟上。 */
        background: var(--app-bg, #ffffff);
        color: var(--app-text, #1b1a1a);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
