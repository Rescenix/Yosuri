<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VRM 动画最终版 - 绕过材质错误</title>
    <style>body { margin: 0; overflow: hidden; background: #111; }</style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { VRMLoaderPlugin, VRMUtils, MToonMaterial } from '@pixiv/three-vrm';

        // 绕过 MToonMaterial 的 UV 动画错误（临时方案）
        if (MToonMaterial.prototype._updateUVAnimation) {
            MToonMaterial.prototype._updateUVAnimation = function() {};
        }

        const VRM_PATH = '/models/shanxi.vrm';
        const FBX_PATH = '/animation/Walking.fbx';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 4);
        camera.lookAt(0, 1, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0xfff0e0, 1.2);
        mainLight.position.set(2, 5, 3);
        mainLight.castShadow = true;
        scene.add(mainLight);
        scene.add(new THREE.GridHelper(8, 20, 0x888888, 0x444444));

        let vrm, mixer, clock;

        const loader = new GLTFLoader();
        loader.register(parser => new VRMLoaderPlugin(parser));
        loader.load(VRM_PATH, (gltf) => {
            vrm = gltf.userData.vrm;
            if (!vrm) throw new Error('VRM 加载失败');
            const model = vrm.scene;
            scene.add(model);

            VRMUtils.removeUnnecessaryVertices(model);
            VRMUtils.combineSkeletons(model);
            VRMUtils.combineMorphs(model);

            const box = new THREE.Box3().setFromObject(model);
            model.position.set(0, -box.min.y, 0);

            vrm.humanoid.autoUpdateHumanBones = true;
            mixer = new THREE.AnimationMixer(model);
            clock = new THREE.Clock();

            const fbxLoader = new FBXLoader();
            fbxLoader.load(FBX_PATH, (fbx) => {
                const clip = fbx.animations[0];
                if (!clip) return console.error('FBX 无动画');

                const tracks = [];
                for (const track of clip.tracks) {
                    if (track.name === 'J_Bip_L_UpperArm.quaternion') {
                        const times = track.times;
                        const values = track.values;
                        const newVals = new Float32Array(values.length);
                        const fix = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, Math.PI / 2));
                        for (let i = 0; i < values.length; i += 4) {
                            const q = new THREE.Quaternion(values[i], values[i+1], values[i+2], values[i+3]);
                            const qFixed = fix.clone().premultiply(q);
                            newVals[i] = qFixed.x;
                            newVals[i+1] = qFixed.y;
                            newVals[i+2] = qFixed.z;
                            newVals[i+3] = qFixed.w;
                        }
                        tracks.push(new THREE.KeyframeTrack(track.name, times, newVals));
                    } else if (track.name === 'J_Bip_R_UpperArm.quaternion') {
                        const times = track.times;
                        const values = track.values;
                        const newVals = new Float32Array(values.length);
                        const fix = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, -Math.PI / 2));
                        for (let i = 0; i < values.length; i += 4) {
                            const q = new THREE.Quaternion(values[i], values[i+1], values[i+2], values[i+3]);
                            const qFixed = fix.clone().premultiply(q);
                            newVals[i] = qFixed.x;
                            newVals[i+1] = qFixed.y;
                            newVals[i+2] = qFixed.z;
                            newVals[i+3] = qFixed.w;
                        }
                        tracks.push(new THREE.KeyframeTrack(track.name, times, newVals));
                    } else {
                        tracks.push(track.clone());
                    }
                }
                const newClip = new THREE.AnimationClip('walk', clip.duration, tracks);
                const action = mixer.clipAction(newClip);
                action.setLoop(THREE.LoopRepeat);
                action.play();
                console.log('✅ 动画已播放');
            });
        }, undefined, (err) => console.error('VRM 加载失败', err));

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock ? Math.min(clock.getDelta(), 0.033) : 0.016;
            if (mixer) mixer.update(delta);
            if (vrm) vrm.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
