<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>杉汐 Mixamo 动作测试</title>
  <style>body { margin: 0; overflow: hidden; background: #000; }</style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#333');
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 2, 4);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    scene.add(new THREE.DirectionalLight(0xffe8d0, 1.2).translateZ(3));

    const loader = new GLTFLoader();
    loader.load('/models/shanxi.glb', (gltf) => {
      const model = gltf.scene;
      model.position.set(0, 0, 0);
      scene.add(model);

      // 自动缩放
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0 && maxDim < 1) {
        model.scale.setScalar(2 / maxDim);
      }

      // 列出所有动作名称
      const clips = gltf.animations || [];
      console.log('可用动作:', clips.map(c => c.name));

      const mixer = new THREE.AnimationMixer(model);
      const actions = {};
      clips.forEach((clip) => {
        actions[clip.name.toLowerCase()] = mixer.clipAction(clip);
      });

      // 默认播放 idle
      const idleAction = actions['idle'] || actions['idle1'] || Object.values(actions)[0];
      if (idleAction) idleAction.play();

      // 键盘切换动作：按 1-9
      const keyMap = {};
      window.addEventListener('keydown', (e) => {
        if (e.key >= '1' && e.key <= '9') {
          const index = parseInt(e.key) - 1;
          const name = Object.keys(actions)[index];
          if (name) {
            Object.values(actions).forEach(a => a.stop());
            actions[name].reset().play();
            console.log('切换动作:', name);
          }
        }
      });

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        mixer.update(clock.getDelta());
        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>
