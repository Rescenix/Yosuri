<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Unity GLB 快速测试</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#87CEEB');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 4);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // 光照
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dir = new THREE.DirectionalLight(0xffe8d0, 1.5);
    dir.position.set(4, 6, 3);
    dir.castShadow = true;
    scene.add(dir);

    const loader = new GLTFLoader();
    loader.load('/models/shanxi_unity.glb', (gltf) => {
      const model = gltf.scene;

      // 自动缩放
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0 && maxDim < 1) {
        const factor = 2 / maxDim;
        model.scale.set(factor, factor, factor);
      }

      model.position.set(0, 0.5, 0);
      scene.add(model);

      const mixer = new THREE.AnimationMixer(model);
      const animations = gltf.animations;
      if (animations.length > 0) {
        console.log('动画列表:', animations.map(a => a.name));
        mixer.clipAction(animations[0]).play();
      } else {
        console.warn('模型没有动画');
      }

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        mixer.update(clock.getDelta());
        renderer.render(scene, camera);
      }
      animate();

      window.mixer = mixer;
      window.actions = {};
      animations.forEach(c => {
        const action = mixer.clipAction(c);
        window.actions[c.name] = action;
      });
      console.log('调试：可用 window.mixer 和 window.actions');
    }, undefined, (err) => {
      console.error('加载失败', err);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
