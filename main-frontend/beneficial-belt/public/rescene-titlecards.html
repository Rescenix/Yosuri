<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rescene Promo Cards</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07131f; color: #f7faf9; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
      .wrap { width: 100vw; height: 100vh; padding: 70px 78px; display: flex; flex-direction: column; justify-content: center; position: relative; background: radial-gradient(circle at 82% 18%, rgba(55,232,149,.17), transparent 28%), linear-gradient(135deg,#07131f,#0c1b28); }
      .eyebrow { font-size: 16px; letter-spacing: 7px; color: #43e59a; font-weight: 800; }
      .title { font-size: 70px; line-height: 1.05; letter-spacing: -4px; font-weight: 900; margin: 28px 0; }
      .title em { font-style: normal; color: #43e59a; }
      .sub { font-size: 24px; color: #afbec8; }
      .timer { position: absolute; right: 78px; bottom: 64px; border: 2px solid #43e59a; border-radius: 999px; padding: 15px 28px; font: 800 22px/1 monospace; color: #43e59a; box-shadow: 0 0 30px rgba(67,229,154,.28); }
      .rule { height: 1px; background: linear-gradient(90deg,#43e59a,transparent); margin: 34px 0; width: 72%; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 42px; margin-top: 40px; }
      .card { padding: 38px; border: 1px solid rgba(255,255,255,.13); border-radius: 24px; background: rgba(255,255,255,.035); }
      .card p { font-size: 27px; color: #afbec8; line-height: 1.55; }
      .badge { display: inline-flex; padding: 10px 18px; border-radius: 99px; background: #43e59a; color: #07131f; font-weight: 900; font-size: 18px; }
    </style>
  </head>
  <body>
    <main id="card" class="wrap"></main>
    <script>
      const card = new URLSearchParams(location.search).get('card') || '1'
      const cards = {
        1: '<div class="eyebrow">RESCENE · REAL MACHINE DEMO</div><div class="title">DeepSeek V4 Pro 很强。<br><em>我把它装进一家公司。</em></div><div class="rule"></div><div class="sub">模型负责思考，组织负责把结果交付到磁盘。</div><div class="timer">00:00</div>',
        2: '<div class="eyebrow">MODEL ≠ COMPANY</div><div class="title" style="font-size:60px">一个模型，负责策划。<br><em>73 个 Agent，负责交付。</em></div><div class="cols"><div class="card"><span class="badge">DEEPSEEK V4 PRO</span><p>按指定模型生成项目策划，不偷偷切换。</p></div><div class="card"><span class="badge">RESCENE COMPANY OS</span><p>研究、写作、设计、程序、宣传、发布接力。</p></div></div><div class="timer">00:17</div>',
        3: '<div class="eyebrow">LESS CHAT. MORE AUTOMATIC.</div><div class="title">不是漂亮回复。<br><em>是 11/11 的完整交付。</em></div><div class="rule"></div><div class="sub">Rescene Agent OS · v0.1.3-alpha.3</div><div class="timer">00:50</div>'
      }
      document.querySelector('#card').innerHTML = cards[card] || cards[1]
    </script>
  </body>
</html>
