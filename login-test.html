<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #999;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab:hover {
            color: #667eea;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #eee;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #999;
            font-size: 13px;
            position: relative;
        }

        .social-login {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .sparkle {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .title {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sparkle">✨</div>
        <h1 class="title">魔法少女登录中心</h1>
        <p class="subtitle">欢迎来到二次元编程世界~喵！</p>

        <div class="tabs">
            <div class="tab active" data-target="login">登录</div>
            <div class="tab" data-target="register">注册</div>
        </div>

        <!-- 登录表单 -->
        <div id="login" class="form-section active">
            <div id="login-msg" class="message"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">用户名 / 邮箱</label>
                    <input type="text" id="login-username" name="username" placeholder="请输入用户名或邮箱" required>
                </div>
                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" name="password" placeholder="请输入密码" required>
                </div>
                <div class="forgot-password">
                    <a href="#">忘记密码？</a>
                </div>
                <button type="submit" class="btn btn-primary">登 录</button>
            </form>

            <div class="divider">
                <span>其他登录方式</span>
            </div>

            <div class="social-login">
                <button class="social-btn" onclick="socialLogin('GitHub')">GitHub</button>
                <button class="social-btn" onclick="socialLogin('Gitee')">Gitee</button>
                <button class="social-btn" onclick="socialLogin('QQ')">QQ</button>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="register" class="form-section">
            <div id="register-msg" class="message"></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-username">用户名</label>
                    <input type="text" id="reg-username" name="username" placeholder="设置一个酷炫的用户名" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">邮箱</label>
                    <input type="email" id="reg-email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">密码</label>
                    <input type="password" id="reg-password" name="password" placeholder="设置密码（至少6位）" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="reg-confirm">确认密码</label>
                    <input type="password" id="reg-confirm" name="confirm" placeholder="再次输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary">注 册</button>
            </form>
        </div>
    </div>

    <script>
        // 标签切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });

        // 显示消息
        function showMessage(formId, text, type) {
            const msgEl = document.getElementById(formId + '-msg');
            msgEl.textContent = text;
            msgEl.className = 'message ' + type;
            setTimeout(() => msgEl.className = 'message', 3000);
        }

        // 登录提交
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            // 模拟验证
            if (username && password) {
                showMessage('login', '✨ 登录成功！欢迎回来，' + username + ' ~喵！', 'success');
                console.log('[登录]', { username, password });
            } else {
                showMessage('login', '❌ 请填写完整信息哦~', 'error');
            }
        });

        // 注册提交
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (password !== confirm) {
                showMessage('register', '❌ 两次密码不一致啦~', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('register', '❌ 密码太短了，至少6位哦~', 'error');
                return;
            }

            showMessage('register', '✨ 注册成功！欢迎加入魔法世界，' + username + ' ~喵！', 'success');
            console.log('[注册]', { username, email, password });

            // 2秒后自动切换到登录
            setTimeout(() => {
                document.querySelector('.tab[data-target="login"]').click();
            }, 2000);
        });

        // 社交登录
        function socialLogin(platform) {
            alert('🚀 正在跳转 ' + platform + ' 授权登录……（演示用）');
        }
    </script>
</body>
</html>
