name: Update Star History

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install chart dependencies
        run: pip install --disable-pip-version-check matplotlib numpy
      - name: Render star-history images
        env:
          # Create this repository secret from a classic PAT with public_repo scope.
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN }}
        run: python scripts/gen_star_history.py --repo "${{ github.repository }}" --refresh
      - name: Commit updated charts
        run: |
          if git diff --quiet -- assets/star-history-light.png assets/star-history-dark.png; then
            echo "Star history is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history-light.png assets/star-history-dark.png
          git commit -m "chore: update star history"
          git push
