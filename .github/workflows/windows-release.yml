name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "*_v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SETUP_NAME: Rescene-windows-amd64-setup.exe

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: main-backend/go.mod
          cache-dependency-path: main-backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: main-frontend/beneficial-belt/package-lock.json

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          choco install nsis --yes --no-progress

      - name: Build unsigned Windows installer
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Verify unsigned build contract
        shell: pwsh
        run: |
          $setupPath = Join-Path $PWD "dist/$env:SETUP_NAME"
          if (-not (Test-Path -LiteralPath $setupPath)) {
            throw "Missing installer: $setupPath"
          }
          if (Test-Path -LiteralPath (Join-Path $PWD "dist/Rescene-windows-amd64.zip")) {
            throw "Portable ZIP must not be produced"
          }

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: rescene-windows-unsigned
          path: dist/${{ env.SETUP_NAME }}
          archive: false
          if-no-files-found: error